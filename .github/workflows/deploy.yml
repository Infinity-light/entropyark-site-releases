name: Deploy Entropy Ark Website
run-name: "deploy ${{ github.event.client_payload.source_sha }} [${{ github.event.client_payload.dispatch_id }}]"

on:
  repository_dispatch:
    types: [deploy]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit SHA or ref to deploy
        required: true
        default: main
      repo:
        description: Source repository
        required: true
        default: Infinity-light/entropyark-site

concurrency:
  group: deploy-entropyark-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, entropyark]
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Resolve immutable source
        id: source
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "ref=${{ github.event.client_payload.source_sha }}" >> "$GITHUB_OUTPUT"
            echo "repo=${{ github.event.client_payload.repo }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ inputs.ref }}" >> "$GITHUB_OUTPUT"
            echo "repo=${{ inputs.repo }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout private source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.source.outputs.repo }}
          ref: ${{ steps.source.outputs.ref }}
          token: ${{ secrets.GH_RELEASE_REPO_TOKEN }}

      - name: Build static site
        shell: bash
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Publish atomically
        shell: bash
        run: |
          set -euo pipefail
          target=/opt/apps/entropyark-site/site
          staging=/opt/apps/entropyark-site/site.next
          rm -rf "$staging"
          mkdir -p "$staging"
          rsync -a --delete dist/ "$staging/"
          rm -rf "${target}.previous"
          if [ -d "$target" ]; then mv "$target" "${target}.previous"; fi
          mv "$staging" "$target"

      - name: Verify production files
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error \
              --resolve www.entropyark.com:443:127.0.0.1 \
              https://www.entropyark.com/ | grep -q '熵舟科技'; then
              echo "Production verification passed"
              exit 0
            fi
            echo "Attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1
